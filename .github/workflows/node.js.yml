name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PNPM_VERSION: 8.x

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        run_install: false
        
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
          
    - name: Install dependencies
      shell: bash
      run: |
        if [ -f pnpm-lock.yaml ]; then
          echo "Installing dependencies with frozen lockfile..."
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --no-frozen-lockfile
        else
          echo "No lockfile found. Installing dependencies without frozen lockfile..."
          pnpm install --no-frozen-lockfile
        fi
      
    - name: Generate lockfile
      run: |
        if [ ! -f pnpm-lock.yaml ]; then
          echo "Generating pnpm-lock.yaml file..."
          pnpm install
        fi
      
    - name: Build
      run: pnpm build
      env:
        CI: true
        NODE_ENV: production
      
    - name: Check types
      run: pnpm exec tsc --noEmit
      
    - name: Run linting
      run: pnpm lint
